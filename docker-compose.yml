# Run everything:  docker compose up --build        (copy .env.example to .env first)
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: snack
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: snackstream
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U snack -d snackstream"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    # Anything else from api/.env.example can be put in the root .env and reaches the API container through this file.
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://snack:${POSTGRES_PASSWORD}@db:5432/snackstream
      APP_ENV: ${APP_ENV:-dev}
      SECRET_KEY: ${SECRET_KEY:-dev-only-change-me}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      # Optional live settings; provider secrets never go to the web container.
      LIVE_SIMLI_ENABLED: ${LIVE_SIMLI_ENABLED:-false}
      LIVE_SIMLI_TRANSPORT: ${LIVE_SIMLI_TRANSPORT:-mock}
      LIVE_SIMLI_API_KEY: ${LIVE_SIMLI_API_KEY:-}
      LIVE_CONTENT_ENABLED: ${LIVE_CONTENT_ENABLED:-false}
      LIVE_SIMLI_REPLY_AUDIO_ENABLED: ${LIVE_SIMLI_REPLY_AUDIO_ENABLED:-false}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      ELEVENLABS_VOICE_ID: ${ELEVENLABS_VOICE_ID:-}
      ELEVENLABS_MODEL_ID: ${ELEVENLABS_MODEL_ID:-}
      LIVE_MAKE_ENABLED: ${LIVE_MAKE_ENABLED:-false}
      LIVE_MAKE_WEBHOOK_URL: ${LIVE_MAKE_WEBHOOK_URL:-}
      LIVE_MAKE_CALLBACK_TOKEN: ${LIVE_MAKE_CALLBACK_TOKEN:-}
      LIVE_MAKE_RESULT_TIMEOUT_SECONDS: ${LIVE_MAKE_RESULT_TIMEOUT_SECONDS:-180}
      LIVE_MOCK_ENABLED: ${LIVE_MOCK_ENABLED:-false}
      LIVE_MOCK_VIDEO_DURATION_SECONDS: ${LIVE_MOCK_VIDEO_DURATION_SECONDS:-10.077007}
      # E-mail links for customer accounts (see api/.env.example); the key stays in this container only.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-SnackStream <onboarding@resend.dev>}
      CLOUDINARY_URL: ${CLOUDINARY_URL:-}
      WEB_BASE_URL: ${WEB_BASE_URL:-http://localhost:3000}
      LIVE_SIMLI_AUDIO_PATH: ${LIVE_SIMLI_AUDIO_PATH:-}
      LIVE_SIMLI_AUDIO_SKU: ${LIVE_SIMLI_AUDIO_SKU:-}
      LIVE_SIMLI_MOCK_REPLY_WAV_PATH: ${LIVE_SIMLI_MOCK_REPLY_WAV_PATH:-}
      LIVE_SIMLI_MOCK_VIDEO_PATH: ${LIVE_SIMLI_MOCK_VIDEO_PATH:-}
      LIVE_FFPROBE_PATH: ${LIVE_FFPROBE_PATH:-ffprobe}
    # Migrations are a deploy step: run them, then serve.
    command:
      - sh
      - -c
      - python -m app.cli migrate && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips='*'
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  web:
    build: ./web
    environment:
      API_URL: http://api:8000
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  dbdata:
