# Run the whole system: docker compose up --build
# Requires a .env file in the repo root (see .env.example).
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: snack_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: snackstream
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U snack_app -d snackstream"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./apps/api
    environment:
      DATABASE_URL: postgresql+psycopg://snack_app:${POSTGRES_PASSWORD}@db:5432/snackstream
      APP_ENV: ${APP_ENV:-dev}
      SECRET_KEY: ${SECRET_KEY:-dev-only-secret-change-me}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      SEED_DEMO: ${SEED_DEMO:-}
      INGEST_TOKEN: ${INGEST_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  web:
    build: ./apps/web
    environment:
      API_URL: http://api:8000
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  dbdata:
