# Render blueprint for the staging API + database. The web app is deployed separately on Vercel (see docs/DEPLOY.md).
databases:
  - name: snackstream-db
    plan: free
    databaseName: snackstream
    user: snackstream

services:
  - type: web
    name: snackstream-api
    runtime: docker
    rootDir: api
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/healthz
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: snackstream-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      # Staging has no shell, so migrate and seed the labelled demo catalog at start-up.
      - key: RUN_MIGRATIONS_ON_START
        value: "true"
      - key: SEED_DEMO_CATALOG
        value: "1"
      # Create the first admin once; set these in the Render dashboard (sync: false keeps them out of git).
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false

      # ---- Online payment (VNPay SANDBOX). Leave empty to offer cash on delivery only.
      # Get a test merchant at https://sandbox.vnpayment.vn. VNPAY_RETURN_URL is the WEB address + /checkout/result, e.g.
      # https://<your-app>.vercel.app/checkout/result. The gateway's server callback (IPN) is set in the VNPay merchant page to
      # https://<this-service>.onrender.com/api/payments/vnpay/ipn
      - key: VNPAY_TMN_CODE
        sync: false
      - key: VNPAY_HASH_SECRET
        sync: false
      - key: VNPAY_RETURN_URL
        sync: false

      # ---- Stock from Odoo (optional). Leave empty to keep stock only in our own tables.
      - key: ODOO_URL
        sync: false
      - key: ODOO_DB
        sync: false
      - key: ODOO_API_KEY
        sync: false
      # A count copied from Odoo older than this many minutes is shown as "contact the shop". 0 = never expire.
      - key: STOCK_STALE_MINUTES
        value: "0"

# Scheduled jobs. Render cron jobs are not on the free plan, so they are left commented out. Without them the shop still works:
