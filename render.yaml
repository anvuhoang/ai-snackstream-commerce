# Render blueprint for the staging API + database. The web app is deployed separately on Vercel (see docs/DEPLOY.md).
databases:
  - name: snackstream-db
    plan: free
    databaseName: snackstream
    user: snackstream

services:
  - type: web
    name: snackstream-api
    runtime: docker
    rootDir: api
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/healthz
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: snackstream-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      # Staging has no shell, so migrate and seed the labelled demo catalog at start-up.
      - key: RUN_MIGRATIONS_ON_START
        value: "true"
      - key: SEED_DEMO_CATALOG
        value: "1"
      # Product pictures. Render's free disk is wiped on every restart, so keep them on Cloudinary: copy "API Environment
      # variable" (cloudinary://<key>:<secret>@<cloud>) from the Cloudinary dashboard. Empty = local folder (lost on restart).
      - key: CLOUDINARY_URL
        sync: false
      # Create the first admin once; set these in the Render dashboard (sync: false keeps them out of git).
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false

      # ---- Online payment (payOS, real money). The keys are on the payment channel at https://my.payos.vn. Leave empty to switch
      # it off. PAYOS_RETURN_URL is the WEB address + /checkout/result and PAYOS_CANCEL_URL the WEB address + /checkout. The
      # webhook is set on my.payos.vn to https://<this-service>.onrender.com/api/payments/payos/webhook
      - key: PAYOS_CLIENT_ID
        sync: false
      - key: PAYOS_API_KEY
        sync: false
      - key: PAYOS_CHECKSUM_KEY
        sync: false
      - key: PAYOS_RETURN_URL
        sync: false
      - key: PAYOS_CANCEL_URL
        sync: false

      # ---- E-mail for customer accounts (https://resend.com). Verification and password-reset links are sent from here.
      # WEB_BASE_URL is the WEB address (the Vercel URL, no trailing slash): links in e-mails point to it.
      # Without a verified domain on Resend, MAIL_FROM must stay onboarding@resend.dev and mail reaches only your own address.
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        value: "SnackStream <onboarding@resend.dev>"
      - key: WEB_BASE_URL
        sync: false

      # ---- The shop's own Shopee page. A product with no Shopee link of its own sends the customer here.
      - key: SHOPEE_SHOP_URL
        value: https://shopee.vn/tohuyenchau555

      # ---- Stock from Odoo (optional). Leave empty to keep stock only in our own tables.
      - key: ODOO_URL
        sync: false
      - key: ODOO_DB
        sync: false
      - key: ODOO_API_KEY
        sync: false
      # A count copied from Odoo older than this many minutes is shown as "contact the shop". 0 = never expire.
      - key: STOCK_STALE_MINUTES
        value: "0"

# Scheduled jobs. Render cron jobs are not on the free plan, so they are left commented out. Without them the shop still works:
