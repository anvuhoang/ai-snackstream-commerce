name: ci

on:
  pull_request:
  push:
    branches: [main, dev]

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: snack
          POSTGRES_PASSWORD: snack
          POSTGRES_DB: snackstream_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U snack -d snackstream_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: Tests (SQLite)
        run: uv run pytest
      - name: PostgreSQL smoke tests
        env:
          POSTGRES_TEST_URL: postgresql+psycopg://snack:snack@localhost:5432/snackstream_test
        run: uv run pytest -m postgres
      - name: Migrations on PostgreSQL
        env:
          DATABASE_URL: postgresql+psycopg://snack:snack@localhost:5432/snackstream_test
        run: uv run python -m app.cli migrate
      - name: Contract is up to date
        run: |
          uv run python -m app.export_openapi openapi.json
          git diff --exit-code openapi.json

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Generated types are up to date
        run: |
          npm run gen:types
          git diff --exit-code src/lib/api/schema.d.ts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
